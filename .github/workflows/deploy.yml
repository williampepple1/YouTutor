name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  APP_NAME: yoututor

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mangum

      - name: Build Lambda deployment package
        run: |
          mkdir -p build
          cp -r backend.py deploy build/
          cp -r deploy/lambda/handler.py build/deploy/lambda/
          pip install -r requirements.txt -t build/
          pip install mangum -t build/
          cd build
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          zip -r ../deploy/lambda.zip . -x ".*" > /dev/null 2>&1
          cd ..

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform Init & Apply
        working-directory: deploy/terraform
        run: |
          terraform init
          terraform apply -auto-approve -var="use_cloudfront=true"

      - name: Upload Lambda zip to S3 & sync frontend
        run: |
          BUCKET=$(terraform -chdir=deploy/terraform output -raw s3_bucket)
          aws s3 cp deploy/lambda.zip s3://$BUCKET/lambda/lambda.zip
          aws s3 sync static/ s3://$BUCKET/ --delete

      - name: Get CloudFront ID and invalidate (if deployed)
        run: |
          CF_ID=$(terraform -chdir=deploy/terraform output -raw cloudfront_id)
          if [ -n "$CF_ID" ] && [ "$CF_ID" != "" ]; then
            aws cloudfront create-invalidation --distribution-id "$CF_ID" --paths "/*"
            echo "CloudFront cache invalidated"
          else
            echo "CloudFront not deployed, skipping invalidation"
          fi

      - name: Show deployment URLs
        run: |
          terraform -chdir=deploy/terraform output
