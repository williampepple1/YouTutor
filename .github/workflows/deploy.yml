name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  APP_NAME: yoututor

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mangum

      - name: Build Lambda deployment package
        run: |
          # Create a deployment directory
          mkdir -p build
          
          # Copy application code
          cp -r backend.py deploy build/
          cp -r deploy/lambda/handler.py build/deploy/lambda/
          
          # Install dependencies into build
          pip install -r requirements.txt -t build/
          pip install mangum -t build/
          
          # Clean up unnecessary files
          cd build
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
          
          # Create the zip
          zip -r ../deploy/lambda.zip . -x ".*" > /dev/null 2>&1
          cd ..

      - name: Upload Lambda zip to S3
        run: |
          aws s3 cp deploy/lambda.zip s3://${{ env.APP_NAME }}-${{ secrets.AWS_ACCOUNT_ID }}/lambda/lambda.zip

      - name: Deploy frontend to S3
        run: |
          aws s3 sync static/ s3://${{ env.APP_NAME }}-${{ secrets.AWS_ACCOUNT_ID }}/ --delete

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform Init
        working-directory: deploy/terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: deploy/terraform
        run: terraform apply -auto-approve

      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(terraform -chdir=deploy/terraform output -raw cloudfront_id 2>/dev/null || aws cloudfront list-distributions --query "DistributionList.Items[?contains(Origins.Items[].DomainName, '$(aws s3api list-buckets --query "Buckets[?contains(Name, '${{ env.APP_NAME }}')].Name" --output text)')].Id" --output text)
          if [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          fi

      - name: Show deployment URL
        run: |
          CF_URL=$(terraform -chdir=deploy/terraform output -raw cloudfront_url 2>/dev/null || echo "pending")
          echo "🔗 Deployed at: $CF_URL"
